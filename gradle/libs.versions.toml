[versions]
# Потолок, который поддерживает Android Studio 2025.3.4 (build 253.x).
# Более новый AGP собирается из консоли, но IDE отвергает проект.
agp = "9.2.1"
kotlin = "2.4.10"
ksp = "2.3.11"
hilt = "2.60.1"
appmetricaPlugin = "2.1.0"

activityCompose = "1.13.0"
analytics = "8.5.1"
animationCore = "1.12.0"
appupdate = "10.5.0"
barcodeScanning = "17.3.0"
camera = "1.6.1"
coilCompose = "3.5.0"
composeBom = "2026.08.00"
coreKtx = "1.19.0"
coreSplashscreen = "1.2.0"
espressoCore = "3.7.0"
hiltNavigationCompose = "1.4.0"
hiltWork = "1.4.0"
junit = "4.13.2"
junitVersion = "1.3.0"
kotlinxCoroutines = "1.11.0"
kotlinxSerializationJson = "1.11.0"
lifecycle = "2.11.0"
# Проект использует Material3 Expressive (FloatingActionButtonMenu, FloatingToolbar,
# TopAppBar(contentPadding)) — эти API есть только в alpha-ветке 1.5.0.
material3 = "1.5.0-alpha26"
materialIcons = "1.7.8"
materialVersion = "1.12.0"
mobileads = "8.3.0"
navigationCompose = "2.9.8"
room = "2.8.4"
workRuntime = "2.11.2"
zxingCore = "3.5.4"
uiTextGoogleFonts = "1.12.0"

[libraries]
# Compose (версии берутся из BOM, кроме material3 — он на alpha-ветке)
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
androidx-material = { module = "androidx.compose.material:material", version.ref = "materialVersion" }
androidx-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "materialIcons" }
androidx-compose-animation-core = { group = "androidx.compose.animation", name = "animation-core", version.ref = "animationCore" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

# AndroidX
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "workRuntime" }

# Room
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

# Hilt
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "hiltWork" }

# Kotlinx
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

# Прочее
analytics = { module = "io.appmetrica.analytics:analytics", version.ref = "analytics" }
appupdate = { module = "ru.rustore.sdk:appupdate", version.ref = "appupdate" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coilCompose" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coilCompose" }
mobileads = { module = "com.yandex.android:mobileads", version.ref = "mobileads" }
mobileads-compose = { module = "com.yandex.android:mobileads-compose", version.ref = "mobileads" }

# QR / камера
zxing-core = { module = "com.google.zxing:core", version.ref = "zxingCore" }
mlkit-barcode-scanning = { module = "com.google.mlkit:barcode-scanning", version.ref = "barcodeScanning" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camera" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camera" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camera" }

# Тесты
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-compose-ui-text-google-fonts = { group = "androidx.compose.ui", name = "ui-text-google-fonts", version.ref = "uiTextGoogleFonts" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
jetbrainsKotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinCompose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hiltAndroid = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
appmetrica = { id = "io.appmetrica.analytics", version.ref = "appmetricaPlugin" }