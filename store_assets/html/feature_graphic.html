<!doctype html><html lang="ru"><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1024px;height:500px;overflow:hidden;font-family:'Nunito','Segoe UI',Arial,sans-serif;background:linear-gradient(120deg,#0B3D22 0%,#0F6B3A 55%,#1C9B55 100%);color:#fff;position:relative}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5}
.b1{width:520px;height:520px;background:#63C98A;right:-120px;top:-200px}
.b2{width:420px;height:420px;background:#CDEDA3;left:-160px;bottom:-220px;opacity:.3}
.wrap{position:absolute;inset:0;display:flex;align-items:center;padding:0 330px 0 56px;gap:36px}
.logo{flex:none;width:170px;height:170px;background:#fff;border-radius:46px;display:flex;align-items:center;justify-content:center;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.logo img{width:126px}
h1{font-weight:900;font-size:52px;line-height:1.05;letter-spacing:-.01em;white-space:nowrap}
p{font-size:23px;font-weight:600;color:#D6EBD9;margin-top:12px;max-width:420px;line-height:1.3}
.chips{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.chips span{font-size:17px;font-weight:800;padding:8px 18px;border-radius:999px;background:rgba(255,255,255,.14);color:#CDEDA3}
.phone{position:absolute;right:36px;top:50px;width:225px;border-radius:30px;background:#0e0e10;padding:6px;box-shadow:0 30px 60px rgba(0,0,0,.5);transform:rotate(-8deg)}
.phone div{border-radius:24px;overflow:hidden}.phone img{display:block;width:100%}
</style></head><body><div class="blob b1"></div><div class="blob b2"></div>
<div class="wrap"><div class="logo"><img src="../raw/logo.svg"></div><div><h1>Моё хозяйство</h1><p>Ферма и инкубатор в одном приложении: продукция, продажи, финансы, животные, склад.</p>
<div class="chips"><span>Офлайн</span><span>Склад</span><span>Финансы</span><span>Инкубатор</span><span>QR-шаблоны</span></div></div></div>
<div class="phone"><div><img src="../raw/finance.png"></div></div>
</body></html>
