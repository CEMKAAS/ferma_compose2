<!doctype html><html lang="ru"><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:'Nunito','Segoe UI',Arial,sans-serif;background:linear-gradient(160deg,#0B3D22 0%,#0F6B3A 60%,#1C9B55 100%);color:#FFFFFF;position:relative}body{display:flex;flex-direction:column}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;pointer-events:none}
.b1{width:720px;height:720px;background:#63C98A;right:-260px;top:-220px}
.b2{width:640px;height:640px;background:#CDEDA3;left:-300px;bottom:380px;opacity:.35}
.grain{position:absolute;inset:0;background:radial-gradient(circle at 20% 10%,rgba(255,255,255,.25),transparent 45%)}
.top{position:relative;padding:112px 84px 0;z-index:2}
.kicker{display:inline-flex;align-items:center;gap:14px;font-weight:800;font-size:34px;letter-spacing:.06em;text-transform:uppercase;color:#CDEDA3;background:rgba(255,255,255,.12);padding:16px 30px;border-radius:999px;margin-bottom:36px}
.kicker i{width:16px;height:16px;border-radius:50%;background:#CDEDA3;display:inline-block}
h1{font-weight:900;font-size:84px;line-height:1.08;letter-spacing:-.015em;margin-bottom:30px}
.sub{font-size:38px;line-height:1.35;font-weight:600;color:#D6EBD9;max-width:900px}
.bullets{display:flex;flex-wrap:wrap;gap:16px;margin-top:34px}
.bullets span{font-size:30px;font-weight:700;padding:14px 26px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.bullets span::before{content:'✓';color:#CDEDA3;font-weight:900;margin-right:12px}
.phone{position:relative;flex:none;margin:60px auto 0;width:760px;border-radius:78px;background:#0e0e10;padding:16px;box-shadow:0 60px 120px rgba(0,0,0,.55),0 0 0 2px rgba(255,255,255,.08) inset;z-index:3}
.phone .screen{border-radius:62px;overflow:hidden;background:#000;position:relative}
.phone img{display:block;width:100%}
.phone .notch{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;background:#000;z-index:4}
.brand{position:absolute;right:84px;top:100px;display:flex;align-items:center;gap:18px;z-index:5}
.brand img{width:110px;height:110px;filter:drop-shadow(0 8px 20px rgba(0,0,0,.25))}

.top{padding-top:150px}
.logo{width:200px;height:200px;background:#fff;border-radius:52px;display:flex;align-items:center;justify-content:center;box-shadow:0 30px 60px rgba(0,0,0,.35);margin-bottom:44px}.logo img{width:150px}
h1{font-size:84px}.sub{font-size:40px}
</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div><div class="grain"></div>
<div class="top">
  <div class="logo"><img src="../raw/logo.svg"></div>
  <h1>Ферма и инкубатор<br>в одном приложении</h1>
  <p class="sub">Продукция, продажи, расходы, животные, склад и инкубация — всё под контролем, офлайн и без лишних кнопок.</p>
  
</div>
<div class="phone"><div class="screen"><div class="notch"></div><img src="../raw/home.png"></div></div>
</body></html>
