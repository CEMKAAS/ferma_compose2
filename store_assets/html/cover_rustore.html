<!doctype html><html lang="ru"><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1440px;height:810px;overflow:hidden;font-family:'Nunito','Segoe UI',Arial,sans-serif;background:linear-gradient(120deg,#0B3D22 0%,#0F6B3A 55%,#1C9B55 100%);color:#fff;position:relative}
.blob{position:absolute;border-radius:50%;filter:blur(105px);opacity:.5}
.b1{width:780px;height:780px;background:#63C98A;right:-180px;top:-300px}
.b2{width:630px;height:630px;background:#CDEDA3;left:-240px;bottom:-330px;opacity:.3}
.wrap{position:absolute;inset:0;display:flex;align-items:center;padding:0 495px 0 84px;gap:54px}
.logo{flex:none;width:255px;height:255px;background:#fff;border-radius:69px;display:flex;align-items:center;justify-content:center;box-shadow:0 36px 90px rgba(0,0,0,.35)}
.logo img{width:189px}
h1{font-weight:900;font-size:78px;line-height:1.05;letter-spacing:-.01em;white-space:nowrap}
p{font-size:34.5px;font-weight:600;color:#D6EBD9;margin-top:18px;max-width:630px;line-height:1.3}
.chips{display:flex;gap:15px;margin-top:33px;flex-wrap:wrap}
.chips span{font-size:25.5px;font-weight:800;padding:12px 27px;border-radius:999px;background:rgba(255,255,255,.14);color:#CDEDA3}
.phone{position:absolute;right:54px;top:75px;width:337.5px;border-radius:45px;background:#0e0e10;padding:9px;box-shadow:0 45px 90px rgba(0,0,0,.5);transform:rotate(-8deg)}
.phone div{border-radius:36px;overflow:hidden}.phone img{display:block;width:100%}
</style></head><body><div class="blob b1"></div><div class="blob b2"></div>
<div class="wrap"><div class="logo"><img src="../raw/logo.svg"></div><div><h1>Моё хозяйство</h1><p>Ферма и инкубатор в одном приложении: продукция, продажи, финансы, животные, склад.</p>
<div class="chips"><span>Офлайн</span><span>Склад</span><span>Финансы</span><span>Инкубатор</span><span>QR-шаблоны</span></div></div></div>
<div class="phone"><div><img src="../raw/finance.png"></div></div>
</body></html>
